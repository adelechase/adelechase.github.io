<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{{ page.theme_color | default: '#383338' }}">
  <meta name="description" content="{{ page.description | default: 'Pottery by Adele Chase, Columbia, South Carolina.' | escape }}">
  <title>{{ page.title | escape }} · Adele Chase</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/pottery.css' | relative_url }}">
  <script src="{{ '/assets/js/pottery.js' | relative_url }}" defer></script>
</head>
<body class="pottery-site {{ page.pottery_theme | default: 'theme-clay' }}">
  <a class="art-skip" href="#main">Skip to content</a>
  <header class="art-header" data-art-header>
    <nav class="art-nav" aria-label="Pottery portfolio navigation">
      <a href="{{ '/pottery/' | relative_url }}"{% if page.pottery_nav == 'pottery' %} aria-current="page"{% endif %}>Pottery</a>
      <a href="{{ '/pottery/shows/' | relative_url }}"{% if page.pottery_nav == 'shows' %} aria-current="page"{% endif %}>Shows</a>
      <a href="{{ '/pottery/contact/' | relative_url }}"{% if page.pottery_nav == 'contact' %} aria-current="page"{% endif %}>Contact</a>
      <a class="art-nav-exit" href="{{ '/librarian/' | relative_url }}">Librarian Portfolio</a>
    </nav>
  </header>
  <main id="main" class="art-main">
    {{ content }}
  </main>
</body>
</html>
