<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#183f3a">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/librarian/' | relative_url }}" aria-label="Adele Chase home">Adele Chase<span>Librarian &amp; curious person</span></a>
    <nav aria-label="Main navigation">
      {% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer wrap">
    <div><a class="footer-name" href="{{ '/librarian/' | relative_url }}">Adele Chase</a><p>{{ site.data.profile.location }}</p></div>
    <div class="footer-links"><a href="{{ site.data.profile.mlis_url }}">MLIS portfolio <span aria-hidden="true">↗</span></a><a href="{{ site.data.profile.github_url }}">GitHub <span aria-hidden="true">↗</span></a><span>© {{ 'now' | date: '%Y' }} Adele Chase</span></div>
  </footer>
</body>
</html>
