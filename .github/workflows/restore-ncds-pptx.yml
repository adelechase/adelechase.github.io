name: Restore original NCDS PowerPoint
on:
  push:
    branches: [main]
    paths:
      - 'assets/files/ncds-data-internship/_transfer/**'
permissions:
  contents: write
jobs:
  publish-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify original presentation
        shell: bash
        run: |
          cat assets/files/ncds-data-internship/_transfer/part-*.b64 | base64 --decode > assets/files/ncds-data-internship/FinalPresentation_Project3.pptx
          echo '15c1af2fbed116120ab662c2e99ec17607b57da88dc76b3113b41ed88e5a7c62  assets/files/ncds-data-internship/FinalPresentation_Project3.pptx' | sha256sum --check
      - name: Commit original presentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/files/ncds-data-internship/FinalPresentation_Project3.pptx
          git commit -m 'Add original 2024 NCDS PowerPoint presentation'
          git push
